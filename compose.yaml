
name: projet-comptage-multimodal

services:
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:latest
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
      - ivy-cache:/home/jovyan/.ivy2
    command: start-notebook.py --IdentityProvider.token=${JUPYTER_TOKEN:-cours}
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      PG_URL: jdbc:postgresql://postgres:5432/${PG_DB:-nyctaxi}
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nyctaxi}
      PG_USER: ${PG_USER:-cours}
      PG_PASSWORD: ${PG_PASSWORD:-cours}
    depends_on:
      - postgres
      - rustfs

  rustfs-init:
    image: alpine:3.20
    command: sh -c "chown -R 10001:10001 /data && echo volume pret"
    volumes:
      - lake-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - lake-data:/data
    depends_on:
      rustfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-cours}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cours}
      POSTGRES_DB: ${PG_DB:-nyctaxi}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  streamlit:
    profiles: ["app"]
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    environment:
      PG_HOST: postgres
      PG_DB: ${PG_DB:-nyctaxi}
      PG_USER: ${PG_USER:-cours}
      PG_PASSWORD: ${PG_PASSWORD:-cours}
    depends_on:
      - postgres

  grafana:
    profiles: ["bi"]
    image: grafana/grafana:11.6.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      PG_DB: ${PG_DB:-nyctaxi}
      PG_USER: ${PG_USER:-cours}
      PG_PASSWORD: ${PG_PASSWORD:-cours}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - postgres

  fuseki:
    profiles: ["semantique"]
    image: stain/jena-fuseki:5.1.0
    ports:
      - "127.0.0.1:${FUSEKI_PORT:-3030}:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      FUSEKI_DATASET_1: comptages
    volumes:
      - fuseki-data:/fuseki

volumes:
  ivy-cache:
  lake-data:
  pg-data:
  grafana-data:
  fuseki-data:
