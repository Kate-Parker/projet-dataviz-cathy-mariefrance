apiVersion: 1
datasources:
  - name: PostgreSQL Gold
    uid: postgres-gold
    type: postgres
    access: proxy
    url: postgres:5432
    user: $PG_USER
    jsonData:
      database: $PG_DB
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $PG_PASSWORD
    isDefault: true
    editable: false
